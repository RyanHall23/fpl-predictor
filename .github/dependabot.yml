version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package.json
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    # Security advisories always raise a PR regardless of these rules.
    # Only allow routine version-update PRs for major bumps.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      mui:
        patterns:
          - "@mui/*"
      emotion:
        patterns:
          - "@emotion/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
    # Optionally, enable auto-merge for patch/minor updates:
    # (Requires GitHub repo settings to allow auto-merge)
    # allow:
    #   - dependency-type: "all"
